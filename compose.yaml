services:
  postgres:
    image: postgres:17-alpine
    container_name: orangesentinel-db
    environment:
      POSTGRES_DB: orangesentinel
      POSTGRES_USER: orangesentinel
      POSTGRES_PASSWORD: orangesentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orangesentinel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
