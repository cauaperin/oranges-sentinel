name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      # O runner já tem Docker, então os testes de integração (Testcontainers) rodam de verdade.
      - name: Testes
        run: ./mvnw -B verify

      - name: Resumo de cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { m += $4; c += $5; bm += $6; bc += $7 }
              END { printf "### Cobertura (JaCoCo)\n\n| Métrica | Cobertura |\n|---|---|\n| Instruções | %.1f%% |\n| Branches | %.1f%% |\n", 100*c/(m+c), 100*bc/(bm+bc) }' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Relatório de testes e cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            target/surefire-reports
            target/site/jacoco
