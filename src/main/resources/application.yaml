spring:
  application:
    name: orangesentinel
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orangesentinel}
    username: ${DB_USER:orangesentinel}
    password: ${DB_PASSWORD:orangesentinel}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    # Chaves públicas do serviço auth (o banco só valida tokens, não emite)
    jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:orangesentinel-auth}
  cors:
    origens: ${CORS_ORIGINS:}
  internal:
    # Chave compartilhada nas chamadas entre serviços (header X-Internal-Key). Vazia = API interna fechada.
    chave: ${INTERNAL_KEY:}
  motor:
    # URL base do motor antifraude; vazia desativa a avaliação em tempo real (Pix aprovado sem análise)
    url: ${MOTOR_URL:}
    # Se o motor não responder nesse prazo, o Pix segue sem análise (fail-open)
    timeout: ${MOTOR_TIMEOUT:PT3S}
